[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-recon-suite"
version = "0.1.0"
description = "OSINT Recon Suite -- passive recon aggregator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "dnspython>=2.6.1",
    "python-whois>=0.9.4",
    "pypdf>=4.3.1",
    "python-docx>=1.1.2",
    "Pillow>=10.4.0",
    "Jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
]

[project.scripts]
recon-suite = "osint_recon.main:cli"

[tool.setuptools.packages.find]
include = ["osint_recon", "osint_recon.*"]

[tool.setuptools.package-data]
osint_recon = ["templates/*"]
